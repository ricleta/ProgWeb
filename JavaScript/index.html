<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JS Examples</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/rascunho.js"></script>
  <script src="js/clock.js" defer></script>
  <script src="typescript/innerHTML.js" defer></script>
</head>
<body>
  
  <div id="main-container">
    <div class="navbar">
            <a href="index.html">Home</a>
            <a href="dom.html">DOM</a>
        </div>
    <div id="clock-hook"></div>
    <div class="analog-clock">
      <div class="hand hour-hand"></div>
      <div class="hand minute-hand"></div>
      <div class="hand second-hand"></div>
      <div class="number number-1">1</div>
      <div class="number number-2">2</div>
      <div class="number number-3">3</div>
      <div class="number number-4">4</div>
      <div class="number number-5">5</div>
      <div class="number number-6">6</div>
      <div class="number number-7">7</div>
      <div class="number number-8">8</div>
      <div class="number number-9">9</div>
      <div class="number number-10">10</div>
      <div class="number number-11">11</div>
      <div class="number number-12">12</div>
      <div class="center-dot"></div>
    </div>
    
    <div id="output">
      <!-- Added class="form" to match CSS and removed outdated action attribute -->
      <form id="myForm" class="form">
        <div class="form-group">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <!-- Corrected 'for' attribute to match input id -->
          <label for="n1">N1:</label>
          <input type="number" id="n1" name="n1" required>
        </div>
        <div class="form-group">
          <!-- Corrected 'for' attribute to match input id -->
          <label for="n2">N2:</label>
          <input type="number" id="n2" name="n2" required>
        </div>
        <button type="submit">Submit</button>
      </form>
      <div id="result">
      </div>
    </div>

    <div id="idDiv"> </div>
    <div id="innerHTML-hook">
      <button id="idInnerHTML">innerHTML</button>
    </div>
    <div id="appendChild-hook">
      <button id="idAppendChild">appendChild</button>
    </div>
  </div>
</body>
</html>
