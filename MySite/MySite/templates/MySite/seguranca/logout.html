{% extends 'MySite/seguranca/base.html' %}

{% block title %}
    Logout
{% endblock %}

{% block conteudo %}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card mt-5">
                    <div class="card-header text-center">
                        <h3>Confirmar Logout</h3>
                    </div>
                    <div class="card-body text-center">
                        <p>Tem certeza de que deseja sair?</p>
                        <form method="post" action="{% url 'actual-logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger">Sair</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
