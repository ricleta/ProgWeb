{% extends 'MySite/seguranca/base.html' %}
{% load static %}

{% block conteudo %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card mt-5">
                <div class="card-header text-center">
                    <h3>Login</h3>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="username">Usuário:</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Senha:</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        {% if messages %}
                            <ul class="messages list-unstyled">
                                {% for message in messages %}
                                    <li {% if message.tags %} class="{{ message.tags }} text-danger" {% endif %}>{{ message }}</li>
                                {% endfor %}
                            </ul>
                        {% endif %}
                        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
                    </form>
                </div>
                <div class="card-footer text-center">
                    <p>Não tem uma conta? <a href="{% url 'register' %}">Registre-se aqui</a></p>
                    <p><a href="{% url 'sec-password_reset' %}">Esqueceu sua senha?</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
